version: "3.9"

services:
  # Core event backbone.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: adflex-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: adflex-kafka
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-12}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Telemetry input and persistent event storage.
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: adflex-mqtt-broker
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./services/mqtt-broker/mosquitto.conf/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:2.15.3-pg16
    container_name: adflex-timescaledb
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-energy_flex}
      POSTGRES_USER: ${TIMESCALE_USER:-energy_user}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    ports:
      - "127.0.0.1:${TIMESCALE_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./database/timescale:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Phase 1 telemetry ingestion and normalization path.
  ingestion-api:
    build:
      context: .
      dockerfile: services/ingestion-api/Dockerfile
    container_name: adflex-ingestion-api
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      PORT: 3001
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-ingestion-api
      RAW_TELEMETRY_TOPIC: ${RAW_TELEMETRY_TOPIC:-raw.telemetry}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-256kb}
    ports:
      - "127.0.0.1:${INGESTION_API_PORT:-3001}:3001"
    restart: unless-stopped

  mqtt-subscriber:
    build:
      context: .
      dockerfile: services/mqtt-subscriber/Dockerfile
    container_name: adflex-mqtt-subscriber
    depends_on:
      kafka:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    environment:
      MQTT_BROKER_URL: mqtt://mqtt-broker:1883
      MQTT_TOPIC_FILTER: ${MQTT_TOPIC_FILTER:-telemetry/#}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-mqtt-subscriber
      RAW_TELEMETRY_TOPIC: ${RAW_TELEMETRY_TOPIC:-raw.telemetry}
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: services/engine/Dockerfile
    container_name: adflex-engine
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-engine
      ENGINE_GROUP_ID: ${ENGINE_GROUP_ID:-energy-flex-engine}
      RAW_TELEMETRY_TOPIC: ${RAW_TELEMETRY_TOPIC:-raw.telemetry}
      NORMALIZED_TELEMETRY_TOPIC: ${NORMALIZED_TELEMETRY_TOPIC:-normalized.telemetry}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-energy_flex}
      TIMESCALE_USER: ${TIMESCALE_USER:-energy_user}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    restart: unless-stopped

  # Phase 2 and Phase 3 semantic enrichment path.
  semantic-connector:
    build:
      context: .
      dockerfile: services/semantic-connector/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-semantic-connector
      SEMANTIC_CONNECTOR_GROUP_ID: ${SEMANTIC_CONNECTOR_GROUP_ID:-saref4ener-semantic-connector}
      NORMALIZED_TELEMETRY_TOPIC: ${NORMALIZED_TELEMETRY_TOPIC:-normalized.telemetry}
      SEMANTIC_ENRICHED_TOPIC: ${SEMANTIC_ENRICHED_TOPIC:-semantic.enriched}
      SEMANTIC_RETRY_TOPIC: ${SEMANTIC_RETRY_TOPIC:-semantic.mapping.retry}
      SEMANTIC_DLQ_TOPIC: ${SEMANTIC_DLQ_TOPIC:-semantic.mapping.dlq}
      SLM_ENABLED: ${SLM_ENABLED:-true}
      SLM_PRIMARY: ${SLM_PRIMARY:-true}
      SLM_PROVIDER: ${SLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SLM_MODEL: ${SLM_MODEL:-phi3:mini}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
      SLM_TIMEOUT_MS: ${SLM_TIMEOUT_MS:-30000}
      SLM_MIN_CONFIDENCE: ${SLM_MIN_CONFIDENCE:-0.70}
      SLM_BATCH_MAX_READINGS: ${SLM_BATCH_MAX_READINGS:-128}
      SLM_BATCH_MAX_WAIT_MS: ${SLM_BATCH_MAX_WAIT_MS:-20}
      SLM_BATCH_MAX_PROMPT_TOKENS: ${SLM_BATCH_MAX_PROMPT_TOKENS:-4096}
      SLM_BATCH_MAX_RETRIES: ${SLM_BATCH_MAX_RETRIES:-2}
      SLM_MAX_OUTPUT_TOKENS: ${SLM_MAX_OUTPUT_TOKENS:-8192}
      SLM_PROVIDER_MAX_CONCURRENCY: ${SLM_PROVIDER_MAX_CONCURRENCY:-1}
      SLM_CIRCUIT_FAILURE_THRESHOLD: ${SLM_CIRCUIT_FAILURE_THRESHOLD:-5}
      SLM_CIRCUIT_COOLDOWN_MS: ${SLM_CIRCUIT_COOLDOWN_MS:-30000}
      SLM_WARMUP_ENABLED: ${SLM_WARMUP_ENABLED:-true}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000}
      VLLM_MODEL: ${VLLM_MODEL:-microsoft/Phi-3-mini-4k-instruct}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      SEMANTIC_PARTITIONS_CONCURRENTLY: ${SEMANTIC_PARTITIONS_CONCURRENTLY:-2}
      SEMANTIC_KAFKA_SESSION_TIMEOUT_MS: ${SEMANTIC_KAFKA_SESSION_TIMEOUT_MS:-180000}
      SEMANTIC_KAFKA_HEARTBEAT_MS: ${SEMANTIC_KAFKA_HEARTBEAT_MS:-3000}
      SEMANTIC_KAFKA_MAX_BYTES_PER_PARTITION: ${SEMANTIC_KAFKA_MAX_BYTES_PER_PARTITION:-1048576}
      TIMESCALE_POOL_SIZE: ${SEMANTIC_TIMESCALE_POOL_SIZE:-10}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-energy_flex}
      TIMESCALE_USER: ${TIMESCALE_USER:-energy_user}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    restart: unless-stopped

  # Phase 4 IEEE 2030.5-style translator foundation.
  ieee20305-translator:
    build:
      context: .
      dockerfile: services/ieee20305-translator/Dockerfile
    container_name: adflex-ieee20305-translator
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      IEEE20305_TRANSLATOR_PORT: ${IEEE20305_TRANSLATOR_PORT:-3002}
      KAFKA_BROKER: kafka:29092
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-ieee20305-translator
      IEEE20305_TRANSLATOR_GROUP_ID: ${IEEE20305_TRANSLATOR_GROUP_ID:-ieee20305-translator}
      SEMANTIC_ENRICHED_TOPIC: ${SEMANTIC_ENRICHED_TOPIC:-semantic.enriched}
      IEEE20305_TRANSLATED_TOPIC: ${IEEE20305_TRANSLATED_TOPIC:-ieee20305.translated}
      GRID_SIGNALS_TOPIC: ${GRID_SIGNALS_TOPIC:-grid.signals}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-energy_flex}
      TIMESCALE_USER: ${TIMESCALE_USER:-energy_user}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    ports:
      - "127.0.0.1:${IEEE20305_TRANSLATOR_PORT:-3002}:3002"
    restart: unless-stopped

  # Phase 5 proposal-only aggregator.
  aggregator:
    build:
      context: .
      dockerfile: services/aggregator/Dockerfile
    container_name: adflex-aggregator
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      AGGREGATOR_PORT: ${AGGREGATOR_PORT:-3003}
      KAFKA_BROKER: kafka:29092
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-aggregator
      AGGREGATOR_GROUP_ID: ${AGGREGATOR_GROUP_ID:-adflex-aggregator}
      GRID_SIGNALS_TOPIC: ${GRID_SIGNALS_TOPIC:-grid.signals}
      IEEE20305_TRANSLATED_TOPIC: ${IEEE20305_TRANSLATED_TOPIC:-ieee20305.translated}
      DISPATCH_PROPOSED_TOPIC: ${DISPATCH_PROPOSED_TOPIC:-dispatch.command.proposed}
      DISPATCH_AUDIT_TOPIC: ${DISPATCH_AUDIT_TOPIC:-dispatch.command.audit}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-energy_flex}
      TIMESCALE_USER: ${TIMESCALE_USER:-energy_user}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    ports:
      - "127.0.0.1:${AGGREGATOR_PORT:-3003}:3003"
    restart: unless-stopped

  # Phase 6 approval workflow and safe ready-to-dispatch preparation.
  approval-workflow:
    build:
      context: .
      dockerfile: services/approval-workflow/Dockerfile
    container_name: adflex-approval-workflow
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      APPROVAL_WORKFLOW_PORT: ${APPROVAL_WORKFLOW_PORT:-3004}
      KAFKA_BROKER: kafka:29092
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-approval-workflow
      APPROVAL_WORKFLOW_GROUP_ID: ${APPROVAL_WORKFLOW_GROUP_ID:-adflex-approval-workflow}
      DISPATCH_PROPOSED_TOPIC: ${DISPATCH_PROPOSED_TOPIC:-dispatch.command.proposed}
      DISPATCH_READY_TOPIC: ${DISPATCH_READY_TOPIC:-dispatch.command.ready}
      DISPATCH_APPROVAL_AUDIT_TOPIC: ${DISPATCH_APPROVAL_AUDIT_TOPIC:-dispatch.approval.audit}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-energy_flex}
      TIMESCALE_USER: ${TIMESCALE_USER:-energy_user}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    ports:
      - "127.0.0.1:${APPROVAL_WORKFLOW_PORT:-3004}:3004"
    restart: unless-stopped

  # Phase 7 mock-only dispatch adapter. No real device control.
  mock-dispatch-adapter:
    build:
      context: .
      dockerfile: services/mock-dispatch-adapter/Dockerfile
    container_name: adflex-mock-dispatch-adapter
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      MOCK_DISPATCH_ADAPTER_PORT: ${MOCK_DISPATCH_ADAPTER_PORT:-3005}
      KAFKA_BROKER: kafka:29092
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-mock-dispatch-adapter
      MOCK_DISPATCH_GROUP_ID: ${MOCK_DISPATCH_GROUP_ID:-adflex-mock-dispatch-adapter}
      DISPATCH_READY_TOPIC: ${DISPATCH_READY_TOPIC:-dispatch.command.ready}
      DISPATCH_MOCK_SENT_TOPIC: ${DISPATCH_MOCK_SENT_TOPIC:-dispatch.command.mock.sent}
      DISPATCH_MOCK_RESULT_TOPIC: ${DISPATCH_MOCK_RESULT_TOPIC:-dispatch.command.mock.result}
      DISPATCH_MOCK_AUDIT_TOPIC: ${DISPATCH_MOCK_AUDIT_TOPIC:-dispatch.mock.audit}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-energy_flex}
      TIMESCALE_USER: ${TIMESCALE_USER:-energy_user}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    ports:
      - "127.0.0.1:${MOCK_DISPATCH_ADAPTER_PORT:-3005}:3005"
    restart: unless-stopped

  # Simulator architecture layer: simulated Shelly Plug API.
  shelly-simulator:
    build:
      context: .
      dockerfile: services/shelly-simulator/Dockerfile
    container_name: adflex-shelly-simulator
    environment:
      SHELLY_SIMULATOR_PORT: ${SHELLY_SIMULATOR_PORT:-3007}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-256kb}
    ports:
      - "127.0.0.1:${SHELLY_SIMULATOR_PORT:-3007}:3007"
    restart: unless-stopped

  # Simulator architecture layer: simulated Enode / Easee Core charger API.
  enode-simulator:
    build:
      context: .
      dockerfile: services/enode-simulator/Dockerfile
    container_name: adflex-enode-simulator
    environment:
      ENODE_SIMULATOR_PORT: ${ENODE_SIMULATOR_PORT:-3008}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-256kb}
    ports:
      - "127.0.0.1:${ENODE_SIMULATOR_PORT:-3008}:3008"
    restart: unless-stopped

  # Simulator architecture layer: simulated heat pump API.
  heat-pump-simulator:
    build:
      context: .
      dockerfile: services/heat-pump-simulator/Dockerfile
    container_name: adflex-heat-pump-simulator
    environment:
      HEAT_PUMP_SIMULATOR_PORT: ${HEAT_PUMP_SIMULATOR_PORT:-3011}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-256kb}
    ports:
      - "127.0.0.1:${HEAT_PUMP_SIMULATOR_PORT:-3011}:3011"
    restart: unless-stopped

  # Bounded virtual fleet: one process maintains many household/device states.
  household-fleet-simulator:
    build:
      context: .
      dockerfile: services/household-fleet-simulator/Dockerfile
    container_name: adflex-household-fleet-simulator
    depends_on:
      timescaledb:
        condition: service_healthy
      security-gateway:
        condition: service_started
    environment:
      HOUSEHOLD_FLEET_SIMULATOR_PORT: ${HOUSEHOLD_FLEET_SIMULATOR_PORT:-3012}
      FLEET_HOUSEHOLD_COUNT: ${FLEET_HOUSEHOLD_COUNT:-20}
      FLEET_RANDOM_SEED: ${FLEET_RANDOM_SEED:-20260724}
      FLEET_REPORTING_INTERVAL_MS: ${FLEET_REPORTING_INTERVAL_MS:-180000}
      FLEET_SCHEDULER_TICK_MS: ${FLEET_SCHEDULER_TICK_MS:-250}
      FLEET_MAX_IN_FLIGHT: ${FLEET_MAX_IN_FLIGHT:-8}
      FLEET_AUTOSTART: ${FLEET_AUTOSTART:-true}
      FLEET_COMMUNITY_ID: ${FLEET_COMMUNITY_ID:-community-dublin-north}
      FLEET_HOUSEHOLD_PREFIX: ${FLEET_HOUSEHOLD_PREFIX:-demo-household}
      FLEET_AREA_PREFIX: ${FLEET_AREA_PREFIX:-dublin-north}
      SECURITY_GATEWAY_URL: http://security-gateway:3010
      EDGE_API_KEY: ${EDGE_API_KEY:-local-dev-edge-key}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-energy_flex}
      TIMESCALE_USER: ${TIMESCALE_USER:-energy_user}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    ports:
      - "127.0.0.1:${HOUSEHOLD_FLEET_SIMULATOR_PORT:-3012}:3012"
    restart: unless-stopped

  # Device API translation layer: approved command to simulated device APIs.
  device-command-translator:
    build:
      context: .
      dockerfile: services/device-command-translator/Dockerfile
    container_name: adflex-device-command-translator
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      shelly-simulator:
        condition: service_started
      enode-simulator:
        condition: service_started
      heat-pump-simulator:
        condition: service_started
    environment:
      DEVICE_COMMAND_TRANSLATOR_PORT: ${DEVICE_COMMAND_TRANSLATOR_PORT:-3009}
      KAFKA_BROKER: kafka:29092
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-device-command-translator
      DEVICE_COMMAND_TRANSLATOR_GROUP_ID: ${DEVICE_COMMAND_TRANSLATOR_GROUP_ID:-adflex-device-command-translator}
      DISPATCH_READY_TOPIC: ${DISPATCH_READY_TOPIC:-dispatch.command.ready}
      DEVICE_COMMAND_RESULT_TOPIC: ${DEVICE_COMMAND_RESULT_TOPIC:-device.command.result}
      DEVICE_COMMAND_AUDIT_TOPIC: ${DEVICE_COMMAND_AUDIT_TOPIC:-device.command.audit}
      SHELLY_SIMULATOR_URL: ${SHELLY_SIMULATOR_URL:-http://shelly-simulator:3007}
      ENODE_SIMULATOR_URL: ${ENODE_SIMULATOR_URL:-http://enode-simulator:3008}
      HEAT_PUMP_SIMULATOR_URL: ${HEAT_PUMP_SIMULATOR_URL:-http://heat-pump-simulator:3011}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-energy_flex}
      TIMESCALE_USER: ${TIMESCALE_USER:-energy_user}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    ports:
      - "127.0.0.1:${DEVICE_COMMAND_TRANSLATOR_PORT:-3009}:3009"
    restart: unless-stopped

  # Phase 8 dataspace-style export foundation with minimized summaries.
  dataspace-export:
    build:
      context: .
      dockerfile: services/dataspace-export/Dockerfile
    container_name: adflex-dataspace-export
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      DATASPACE_EXPORT_PORT: ${DATASPACE_EXPORT_PORT:-3006}
      DATASPACE_API_KEY: ${DATASPACE_API_KEY:-local-dev-dataspace-key}
      DATASPACE_CATALOG_TOPIC: ${DATASPACE_CATALOG_TOPIC:-dataspace.catalog}
      DATASPACE_EXPORT_AUDIT_TOPIC: ${DATASPACE_EXPORT_AUDIT_TOPIC:-dataspace.export.audit}
      DATASPACE_DEFAULT_COMMUNITY: ${DATASPACE_DEFAULT_COMMUNITY:-community-dublin-north}
      DATASPACE_PSEUDONYMIZATION_SALT: ${DATASPACE_PSEUDONYMIZATION_SALT:-local-dev-salt}
      DATASPACE_MAX_RECORDS: ${DATASPACE_MAX_RECORDS:-100}
      KAFKA_BROKER: kafka:29092
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-dataspace-export
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-energy_flex}
      TIMESCALE_USER: ${TIMESCALE_USER:-energy_user}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    ports:
      - "127.0.0.1:${DATASPACE_EXPORT_PORT:-3006}:3006"
    restart: unless-stopped

  # Production alignment: local security edge for all external HTTP traffic.
  security-gateway:
    build:
      context: .
      dockerfile: services/security-gateway/Dockerfile
    container_name: adflex-security-gateway
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      ingestion-api:
        condition: service_started
      ieee20305-translator:
        condition: service_started
      aggregator:
        condition: service_started
      approval-workflow:
        condition: service_started
      mock-dispatch-adapter:
        condition: service_started
      dataspace-export:
        condition: service_started
      device-command-translator:
        condition: service_started
    environment:
      SECURITY_GATEWAY_PORT: ${SECURITY_GATEWAY_PORT:-3010}
      EDGE_API_KEY: ${EDGE_API_KEY:-local-dev-edge-key}
      EDGE_RATE_LIMIT_WINDOW_MS: ${EDGE_RATE_LIMIT_WINDOW_MS:-60000}
      EDGE_RATE_LIMIT_MAX_REQUESTS: ${EDGE_RATE_LIMIT_MAX_REQUESTS:-120}
      EDGE_IP_ALLOWLIST: ${EDGE_IP_ALLOWLIST:-}
      EDGE_IP_BLOCKLIST: ${EDGE_IP_BLOCKLIST:-}
      EDGE_REQUEST_BODY_LIMIT: ${EDGE_REQUEST_BODY_LIMIT:-256kb}
      SECURITY_GATEWAY_AUDIT_TOPIC: ${SECURITY_GATEWAY_AUDIT_TOPIC:-security.gateway.audit}
      JWT_AUTH_ENABLED: ${JWT_AUTH_ENABLED:-false}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      DATASPACE_API_KEY: ${DATASPACE_API_KEY:-local-dev-dataspace-key}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
      SLM_MODEL: ${SLM_MODEL:-phi3:mini}
      SLM_PRIMARY: ${SLM_PRIMARY:-true}
      CUSTOMER_DASHBOARD_PSEUDONYMIZATION_SALT: ${CUSTOMER_DASHBOARD_PSEUDONYMIZATION_SALT:-local-dashboard-salt}
      CUSTOMER_INSIGHT_REFRESH_MINUTES: ${CUSTOMER_INSIGHT_REFRESH_MINUTES:-60}
      CUSTOMER_INSIGHT_TIMEOUT_MS: ${CUSTOMER_INSIGHT_TIMEOUT_MS:-20000}
      KAFKA_BROKER: kafka:29092
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-security-gateway
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-energy_flex}
      TIMESCALE_USER: ${TIMESCALE_USER:-energy_user}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    ports:
      - "127.0.0.1:${SECURITY_GATEWAY_PORT:-3010}:3010"
    restart: unless-stopped

volumes:
  zookeeper-data:
  kafka-data:
  timescale-data:
