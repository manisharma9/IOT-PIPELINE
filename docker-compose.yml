version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: ditto-mongo
    ports:
      - "27018:27017"
    restart: unless-stopped

  orion-ld:
    image: fiware/orion-ld:latest
    container_name: orion-ld
    depends_on:
      - mongo
    ports:
      - "1026:1026"
    command: -dbhost mongo -mongocOnly -logLevel INFO
    restart: unless-stopped

  ditto-policies:
    image: eclipse/ditto-policies:latest
    container_name: ditto-policies
    hostname: ditto-policies
    depends_on:
      - mongo
    environment:
      - MONGO_DB_HOSTNAME=mongo
      - JAVA_TOOL_OPTIONS=-Dpekko.remote.artery.canonical.hostname=ditto-policies -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-things:2551
    restart: unless-stopped

  ditto-things:
    image: eclipse/ditto-things:latest
    container_name: ditto-things
    hostname: ditto-things
    depends_on:
      - mongo
      - ditto-policies
    environment:
      - MONGO_DB_HOSTNAME=mongo
      - JAVA_TOOL_OPTIONS=-Dpekko.remote.artery.canonical.hostname=ditto-things -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-things:2551
    restart: unless-stopped

  ditto-connectivity:
    image: eclipse/ditto-connectivity:latest
    container_name: ditto-connectivity
    hostname: ditto-connectivity
    depends_on:
      - mongo
      - ditto-policies
    environment:
      - MONGO_DB_HOSTNAME=mongo
      - JAVA_TOOL_OPTIONS=-Dpekko.remote.artery.canonical.hostname=ditto-connectivity -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-things:2551
    restart: unless-stopped

  ditto-things-search:
    image: eclipse/ditto-things-search:latest
    container_name: ditto-things-search
    hostname: ditto-things-search
    depends_on:
      - mongo
      - ditto-policies
    environment:
      - MONGO_DB_HOSTNAME=mongo
      - JAVA_TOOL_OPTIONS=-Dpekko.remote.artery.canonical.hostname=ditto-things-search -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-things:2551
    restart: unless-stopped

  ditto-gateway:
    image: eclipse/ditto-gateway:latest
    container_name: ditto-gateway
    hostname: ditto-gateway
    depends_on:
      - ditto-policies
      - ditto-things
    ports:
      - "8081:8080"
    environment:
      - ENABLE_PRE_AUTHENTICATION=true
      - JAVA_TOOL_OPTIONS=-Dpekko.remote.artery.canonical.hostname=ditto-gateway -Dpekko.cluster.seed-nodes.0=pekko://ditto-cluster@ditto-things:2551
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: adflex-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: adflex-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: adflex-mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./services/mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:2.15.3-pg16
    container_name: adflex-timescaledb
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-energy_flex}
      POSTGRES_USER: ${TIMESCALE_USER:-energy_user}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    ports:
      - "${TIMESCALE_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./database/timescale:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ingestion-api:
    build:
      context: .
      dockerfile: services/ingestion-api/Dockerfile
    container_name: adflex-ingestion-api
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      PORT: 3001
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-ingestion-api
      RAW_TELEMETRY_TOPIC: ${RAW_TELEMETRY_TOPIC:-raw.telemetry}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-256kb}
    ports:
      - "${INGESTION_API_PORT:-3001}:3001"
    restart: unless-stopped

  mqtt-subscriber:
    build:
      context: .
      dockerfile: services/mqtt-subscriber/Dockerfile
    container_name: adflex-mqtt-subscriber
    depends_on:
      kafka:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    environment:
      MQTT_BROKER_URL: mqtt://mqtt-broker:1883
      MQTT_TOPIC_FILTER: ${MQTT_TOPIC_FILTER:-telemetry/#}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-mqtt-subscriber
      RAW_TELEMETRY_TOPIC: ${RAW_TELEMETRY_TOPIC:-raw.telemetry}
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: services/engine/Dockerfile
    container_name: adflex-engine
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-engine
      ENGINE_GROUP_ID: ${ENGINE_GROUP_ID:-energy-flex-engine}
      RAW_TELEMETRY_TOPIC: ${RAW_TELEMETRY_TOPIC:-raw.telemetry}
      NORMALIZED_TELEMETRY_TOPIC: ${NORMALIZED_TELEMETRY_TOPIC:-normalized.telemetry}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-energy_flex}
      TIMESCALE_USER: ${TIMESCALE_USER:-energy_user}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    restart: unless-stopped

  semantic-connector:
    build:
      context: .
      dockerfile: services/semantic-connector/Dockerfile
    container_name: adflex-semantic-connector
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-semantic-connector
      SEMANTIC_CONNECTOR_GROUP_ID: ${SEMANTIC_CONNECTOR_GROUP_ID:-saref4ener-semantic-connector}
      NORMALIZED_TELEMETRY_TOPIC: ${NORMALIZED_TELEMETRY_TOPIC:-normalized.telemetry}
      SEMANTIC_ENRICHED_TOPIC: ${SEMANTIC_ENRICHED_TOPIC:-semantic.enriched}
      SLM_ENABLED: ${SLM_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
      SLM_TIMEOUT_MS: ${SLM_TIMEOUT_MS:-8000}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-energy_flex}
      TIMESCALE_USER: ${TIMESCALE_USER:-energy_user}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    restart: unless-stopped

  ieee20305-translator:
    build:
      context: .
      dockerfile: services/ieee20305-translator/Dockerfile
    container_name: adflex-ieee20305-translator
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      IEEE20305_TRANSLATOR_PORT: ${IEEE20305_TRANSLATOR_PORT:-3002}
      KAFKA_BROKER: kafka:29092
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: adflex-ieee20305-translator
      IEEE20305_TRANSLATOR_GROUP_ID: ${IEEE20305_TRANSLATOR_GROUP_ID:-ieee20305-translator}
      SEMANTIC_ENRICHED_TOPIC: ${SEMANTIC_ENRICHED_TOPIC:-semantic.enriched}
      IEEE20305_TRANSLATED_TOPIC: ${IEEE20305_TRANSLATED_TOPIC:-ieee20305.translated}
      GRID_SIGNALS_TOPIC: ${GRID_SIGNALS_TOPIC:-grid.signals}
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-energy_flex}
      TIMESCALE_USER: ${TIMESCALE_USER:-energy_user}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-energy_password}
    ports:
      - "${IEEE20305_TRANSLATOR_PORT:-3002}:3002"
    restart: unless-stopped

volumes:
  zookeeper-data:
  kafka-data:
  timescale-data:
